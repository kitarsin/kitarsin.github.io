<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="0; url=https://kitarsin.vercel.app/">
    <meta name="theme-color" content="#0a0e17">
    <meta name="description" content="Kristian Lawrence Villaraza’s portfolio has moved to kitarsin.vercel.app.">
    <link rel="canonical" href="https://kitarsin.vercel.app/">
    <link rel="icon" href="fav.ico?v=2" type="image/x-icon">
    <title>Portfolio moved — Kristian Lawrence Villaraza</title>
    <script>
        window.location.replace("https://kitarsin.vercel.app/");
    </script>
    <style>
        :root {
            color-scheme: dark;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #e8f0ff;
            background: #0a0e17;
        }

        * { box-sizing: border-box; }

        body {
            display: grid;
            min-height: 100vh;
            min-height: 100svh;
            margin: 0;
            padding: 24px;
            place-items: center;
        }

        main { width: min(100%, 480px); }
        h1 { margin: 0 0 16px; font-size: clamp(28px, 6vw, 40px); line-height: 1.2; }
        p { margin: 0 0 24px; color: #9aaac4; line-height: 1.6; }
        a {
            display: inline-block;
            max-width: 100%;
            padding: 12px 18px;
            border-radius: 6px;
            color: #07111c;
            background: #8de1ff;
            font-weight: 600;
            overflow-wrap: anywhere;
            text-underline-offset: 3px;
        }
        a:hover { background: #b6efff; }
        a:focus-visible { outline: 2px solid #8de1ff; outline-offset: 5px; }
    </style>
</head>
<body>
    <main>
        <h1>My portfolio has moved.</h1>
        <p>You’re being redirected to my new website. If you’re still here, follow the link below.</p>
        <a href="https://kitarsin.vercel.app/">Go to kitarsin.vercel.app</a>
    </main>
</body>
</html>
